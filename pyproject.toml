[project]
name = "cloth-vision-core"
version = "0.1.0"
description = "Provider-neutral fashion image analysis and item matching toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "onedayonecommit" }]
keywords = ["computer-vision", "fashion", "image-analysis", "recommendation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pillow>=11,<13",
]

[project.optional-dependencies]
openai = [
    "openai>=1.30,<3",
]
anthropic = [
    "anthropic>=0.40,<1",
]
gemini = [
    "google-genai>=1,<2",
]
segmentation = [
    "rembg>=2.0.67,<3",
    "onnxruntime>=1.20,<2",
]
llm = [
    "anthropic>=0.40,<1",
    "google-genai>=1,<2",
    "openai>=1.30,<3",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloth_vision_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
